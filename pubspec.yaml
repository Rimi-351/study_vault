name: study_vault
description: AI Study App with Gemini
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  #firebase_storage: ^12.4.10

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # AI - Gemini
  http: ^1.2.0
  google_mlkit_text_recognition: ^0.13.0
  google_generative_ai: ^0.4.6

  # File & PDF
  file_picker: ^8.3.7
  path_provider: ^2.1.4
  #pdfx: ^2.6.0
  syncfusion_flutter_pdf: ^27.2.5
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.1.4

# ✅ ADD IT HERE:
  flutter_markdown: ^0.7.1
  flutter_highlighter: ^0.1.1
  markdown: ^7.2.2
  
  # Utils
  uuid: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1  # ← Add this line

# Add this section for app icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  
  # ANDROID ADAPTIVE ICONS (The Fix)
  adaptive_icon_background: "#FFFFFF" # Hex color OR path to image "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/icon.png" # Your logo with transparent background  min_sdk_android: 21
  

flutter:
  uses-material-design: true
  # Add this assets section
  assets:
    - assets/icon/